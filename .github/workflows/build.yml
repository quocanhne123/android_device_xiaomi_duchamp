name: Build Recovery

on:
  workflow_dispatch:

env:
  TW_THEME: portrait_hdpi
  TARGET_SCREEN_WIDTH: 1220
  TARGET_SCREEN_HEIGHT: 2712
  TW_SKIP_RES_CHECK: true
  TW_SKIP_THEME_CHECK: true
  ALLOW_MISSING_DEPENDENCIES: true
  FOX_BUILD_DEVICE: duchamp
  LC_ALL: C
  TW_MAX_BRIGHTNESS: "2047"
  TW_DEFAULT_BRIGHTNESS: "1200"
  
  # ================================================
  # CÁC CỜ ÉP GIẢM CÂN CỰC MẠNH (BẮT BUỘC NHẬN)
  # ================================================
  FOX_EXCLUDE_THEMES: "1"
  TW_ONLY_ENGLISH: "true"
  TW_EXCLUDE_TWRPAPP: "1"
  FOX_USE_BASH: "0"
  FOX_USE_NANO: "0"
  FOX_USE_TAR: "0"
  FOX_REMOVE_AAPT: "1"
  FOX_DISABLE_APP_MANAGER: "1"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build environment
        run: |
          sudo apt update
          sudo apt -y upgrade
          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh

      - name: Sync OrangeFox 12.1
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
          cd ${GITHUB_WORKSPACE}/OrangeFox
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          chmod +x orangefox_sync.sh
          ./orangefox_sync.sh --branch 12.1 --path ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1
          rm -rf ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1/.repo

      - name: Clone Device Tree
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1
          git clone -b test https://github.com/quocanhne123/android_device_xiaomi_duchamp.git device/xiaomi/duchamp

      - name: Build
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1
          
          echo "========================================="
          echo "🚀 BƠM LỆNH ÉP GIẢM CÂN TRỰC TIẾP..."
          echo "========================================="
          
          # 1. Kích hoạt FOX_MINI_BUILD (Chế độ gọt sạch mọi thứ của OrangeFox)
          echo "FOX_MINI_BUILD := true" >> device/xiaomi/duchamp/twrp_duchamp.mk
          echo "FOX_EXCLUDE_THEMES := true" >> device/xiaomi/duchamp/twrp_duchamp.mk
          echo "TW_EXCLUDE_TWRPAPP := true" >> device/xiaomi/duchamp/twrp_duchamp.mk
          echo "TW_ONLY_ENGLISH := true" >> device/xiaomi/duchamp/twrp_duchamp.mk
          
          # 2. ÉP NÉN TỐI ĐA (Thuật toán LZ4 mức 9 cao nhất)
          echo "BOARD_RAMDISK_COMPRESSION_ARGS := -9" >> device/xiaomi/duchamp/BoardConfig.mk
          echo "BOARD_VENDOR_RAMDISK_COMPRESSION_ARGS := -9" >> device/xiaomi/duchamp/BoardConfig.mk
          echo "LZ4_RAMDISK_COMPRESS_ARGS := -9" >> device/xiaomi/duchamp/BoardConfig.mk
          
          # Dọn sạch bộ nhớ đệm (tránh việc build system lấy lại file cũ 83MB)
          rm -rf out/
          
          set +e
          source build/envsetup.sh
          
          # Chốt hạ bằng biến môi trường tuyệt đối
          export FOX_MINI_BUILD=1
          export ALLOW_MISSING_DEPENDENCIES=true
          set -e
          
          lunch twrp_duchamp-eng
          make -j1 vendorbootimage
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Recovery-duchamp
          path: |
            OrangeFox/fox_12.1/out/target/product/duchamp/*.img
            OrangeFox/fox_12.1/out/target/product/duchamp/*.zip
