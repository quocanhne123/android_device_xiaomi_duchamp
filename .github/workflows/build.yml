- name: Build
  shell: bash
  run: |
    set -ex

    cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1

    export ALLOW_MISSING_DEPENDENCIES=true
    export FOX_BUILD_DEVICE=duchamp

    source build/envsetup.sh

    echo "===== Device Tree ====="
    ls device/xiaomi/duchamp

    echo "===== vendorsetup.sh ====="
    cat device/xiaomi/duchamp/vendorsetup.sh

    lunch twrp_duchamp-eng

    mka vendorbootimage2
