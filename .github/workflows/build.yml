name: Build OrangeFox duchamp

on:
  workflow_dispatch:
  push:
    branches: [ test ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    # BƯỚC QUAN TRỌNG: Tẩy não Git trước khi Sync
    - name: Sync Source Code
      run: |
        mkdir -p OrangeFox/fox_12.1
        cd OrangeFox/fox_12.1
        
        # 1. Xóa sạch mọi header xác thực của GitHub
        git config --global --unset-all http.https://github.com/.extraheader || true
        git config --global --unset-all http.https://gitlab.com/.extraheader || true
        
        # 2. Ép sử dụng HTTPS thuần túy (không dùng SSH)
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git config --global url."https://gitlab.com/".insteadOf "git@gitlab.com:"
        git config --global url."https://gitlab.com/".insteadOf "git://gitlab.com/"
        
        # 3. Cấu hình Identity để tránh lỗi Permission
        git config --global user.email "you@example.com"
        git config --global user.name "Your Name"
        
        # 4. Chạy repo init với link GitHub Mirror (Ổn định hơn)
        repo init --depth=1 -u https://github.com/OrangeFoxRecovery/Manifest.git -b fox_12.1 --git-lfs
        
        # 5. Sync với env bắt buộc không dùng interactive shell
        export GIT_TERMINAL_PROMPT=0
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Maximize Build Space & Setup Swap
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 12288
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libclang-dev python3 libncurses6 libncurses-dev

    - name: Setup Device Tree
      run: |
        cd OrangeFox/fox_12.1
        rm -rf device/xiaomi/duchamp
        git clone -b test https://github.com/quocanhne123/android_device_xiaomi_duchamp.git device/xiaomi/duchamp

    - name: Run Build
      run: |
        cd OrangeFox/fox_12.1
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_DEVICE=duchamp
        export LC_ALL=C
        
        lunch twrp_duchamp-eng || lunch omni_duchamp-eng
        mka recoveryimage -j$(nproc --all)

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox_Duchamp_Recovery
        path: |
          OrangeFox/fox_12.1/out/target/product/duchamp/*.img
          OrangeFox/fox_12.1/out/target/product/duchamp/*.zip