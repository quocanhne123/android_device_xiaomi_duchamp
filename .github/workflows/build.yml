name: Build OrangeFox duchamp (Slow & Stable)

on:
  workflow_dispatch:
  push:
    branches: [ test ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    # BƯỚC QUAN TRỌNG: Thiết lập môi trường "không đòi hỏi"
    - name: Sync Source Code
      run: |
        mkdir -p OrangeFox/fox_12.1
        cd OrangeFox/fox_12.1
        
        # Vô hiệu hóa trình quản lý chứng thực (để không bao giờ hiện bảng đòi Auth)
        git config --global credential.helper ""
        export GIT_TERMINAL_PROMPT=0
        
        git config --global user.name "BuildBot"
        git config --global user.email "build@bot.com"
        
        # Init và Sync ở chế độ chậm để tránh lỗi kết nối
        repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_12.1 --git-lfs
        repo sync -c -j1 --force-sync --no-clone-bundle --no-tags

    - name: Maximize Build Space & Setup Swap
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 12288
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Prepare Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libclang-dev python3 libncurses6 libncurses-dev
        
        cd OrangeFox/fox_12.1
        rm -rf device/xiaomi/duchamp
        git clone -b test https://github.com/quocanhne123/android_device_xiaomi_duchamp.git device/xiaomi/duchamp

    # BƯỚC BUILD CHẬM: Dùng -j1 hoặc -j2 để máy ảo "dễ thở"
    - name: Run Build
      run: |
        cd OrangeFox/fox_12.1
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_DEVICE=duchamp
        export LC_ALL=C
        
        lunch twrp_duchamp-eng || lunch omni_duchamp-eng
        # CHỈ DÙNG -j1 (Cực kỳ chậm nhưng không bị crash RAM)
        mka recoveryimage -j1

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox_Duchamp_Recovery
        path: |
          OrangeFox/fox_12.1/out/target/product/duchamp/*.img
          OrangeFox/fox_12.1/out/target/product/duchamp/*.zip