name: Build OrangeFox duchamp

on:
  workflow_dispatch:
  push:
    branches: [ test ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # ĐƯA LÊN ĐẦU: Tối ưu dung lượng đĩa trước khi tải code nặng
    - name: Maximize Build Space & Setup Swap
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 12288
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    # SỬA LỖI: Cấu hình Git chính xác để không bị hỏi tài khoản GitLab
    - name: Purge Git and Sync
      run: |
        mkdir -p OrangeFox/fox_12.1
        cd OrangeFox/fox_12.1
        
        # Sửa lỗi authentication: Xóa header mặc định của GitHub áp dụng cho mọi domain
        git config --global --unset-all http.https://github.com/.extraheader || true
        
        # Bật credential helper mặc định và ép cấu hình clone ẩn danh cho GitLab công khai
        git config --global credential.helper cache
        git config --global url."https://gitlab.com/".insteadOf "git@gitlab.com:"
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        
        # Cấu hình định danh Git
        git config --global user.name "BuildBot"
        git config --global user.email "build@bot.com"
        
        # Chạy Repo Init và Sync
        repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_12.1 --git-lfs
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libclang-dev python3 libncurses6 libncurses-dev
        
        cd OrangeFox/fox_12.1
        rm -rf device/xiaomi/duchamp
        git clone -b test https://github.com/quocanhne123/android_device_xiaomi_duchamp.git device/xiaomi/duchamp

    - name: Run Build
      run: |
        cd OrangeFox/fox_12.1
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_DEVICE=duchamp
        export LC_ALL=C
        
        lunch twrp_duchamp-eng || lunch omni_duchamp-eng
        mka recoveryimage -j$(nproc --all)

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox_Duchamp_Recovery
        path: |
          OrangeFox/fox_12.1/out/target/product/duchamp/*.img
          OrangeFox/fox_12.1/out/target/product/duchamp/*.zip
