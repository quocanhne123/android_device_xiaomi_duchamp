name: Build TWRP Recovery

on:
  workflow_dispatch:

env:
  ALLOW_MISSING_DEPENDENCIES: true
  LC_ALL: C

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: 🛡️ Bơm RAM Ảo (Swap) Chống Sập
        run: |
          sudo dd if=/dev/zero of=/swapfile1 bs=1M count=8192 status=progress
          sudo chmod 600 /swapfile1
          sudo mkswap /swapfile1
          sudo swapon /swapfile1

      - name: Cài đặt môi trường biên dịch TWRP
        run: |
          sudo apt update
          sudo apt install -y binutils-aarch64-linux-gnu cpio wget unzip git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Tải Source TWRP Minimal (Gọn nhẹ nhất)
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/twrp
          cd ${GITHUB_WORKSPACE}/twrp
          git config --global user.name "Your Name"
          git config --global user.email "you@example.com"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -j$(nproc --all) --force-sync

      - name: Tải Device Tree
        run: |
          cd ${GITHUB_WORKSPACE}/twrp
          git clone -b test https://github.com/quocanhne123/android_device_xiaomi_duchamp.git device/xiaomi/duchamp

      - name: 🔄 [BƯỚC 2] Khóa Thứ Tự Modules Gốc & Ép Cấu Hình LZ4
        run: |
          cd ${GITHUB_WORKSPACE}/twrp
          
          # Làm sạch các cờ nén cũ để tránh xung đột cấu hình cấu trúc mã nguồn
          sed -i '/BOARD_VENDOR_RAMDISK_COMPRESSION/d' device/xiaomi/duchamp/BoardConfig.mk
          sed -i '/BOARD_RAMDISK_COMPRESSION/d' device/xiaomi/duchamp/BoardConfig.mk
          sed -i '/BOARD_VENDOR_RAMDISK_KERNEL_MODULES_LOAD/d' device/xiaomi/duchamp/BoardConfig.mk

          # 1. Bung stock_vendor_boot.img để lấy dữ liệu chuẩn từ Xiaomi
          wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O magisk.zip
          unzip magisk.zip lib/x86_64/libmagiskboot.so
          mv lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot
          rm -rf magisk.zip lib
          
          if [ -f device/xiaomi/duchamp/stock_vendor_boot.img ]; then
            ./magiskboot unpack device/xiaomi/duchamp/stock_vendor_boot.img
            if [ -f dtb ]; then cp -f dtb device/xiaomi/duchamp/prebuilt/dtb.img; fi
            
            mkdir stock_ramdisk && cd stock_ramdisk
            cpio -id < ../vendor_ramdisk.cpio 2>/dev/null || true
            cd ..
            
            mkdir -p device/xiaomi/duchamp/recovery/root/lib/modules/
            
            # Khôi phục toàn bộ 218/219 modules gốc (Không xóa nhầm DRM/MML/Clock gây màn hình đen)
            cp -rf stock_ramdisk/lib/modules/* device/xiaomi/duchamp/recovery/root/lib/modules/ 2>/dev/null || true
            
            # 🔥 QUAN TRỌNG: Ép hệ thống dùng danh sách thứ tự nạp gốc, chặn đứng lỗi nạp lộn xộn
            cp -f stock_ramdisk/lib/modules/modules.load device/xiaomi/duchamp/recovery/root/lib/modules/modules.load
            cp -f stock_ramdisk/lib/modules/modules.load device/xiaomi/duchamp/recovery/root/lib/modules/modules.load.recovery
            
            cp -f stock_ramdisk/vendor/etc/vintf/manifest.xml device/xiaomi/duchamp/recovery/root/vendor/etc/vintf/ 2>/dev/null || true
            
            rm -rf stock_ramdisk vendor_ramdisk.cpio dtb kernel ramdisk.cpio
          fi

          # 2. Thanh lý các file rác phi-Kernel (Không ảnh hưởng đến quá trình boot phần cứng)
          rm -rf device/xiaomi/duchamp/bootctrl
          rm -rf device/xiaomi/duchamp/mtk_plpath_utils
          rm -rf device/xiaomi/duchamp/recovery/root/vendor/lib64/*camera*.so
          rm -rf device/xiaomi/duchamp/recovery/root/vendor/lib64/*sensor*.so
          
          # Xóa file TEE không thiết yếu chiếm dung lượng khổng lồ (12MB)
          rm -f device/xiaomi/duchamp/recovery/root/vendor/mitee/ta/a734eed9-d6a1-4244-aa507c99719e7b7f.ta

          # 3. Ép giảm dung lượng an toàn (Chỉ loại bỏ log debug, giữ nguyên lõi driver)
          echo "🗜️ Đang chạy lệnh giải phóng dung lượng ảo cho Kernel Modules..."
          find device/xiaomi/duchamp/recovery/root/lib/modules/ -name "*.ko" -exec aarch64-linux-gnu-strip --strip-debug {} \;

          # 4. Bơm cấu hình chuẩn vào BoardConfig.mk (Bắt buộc dùng LZ4 cho LK và khóa danh sách load)
          cat << 'EOF' >> device/xiaomi/duchamp/BoardConfig.mk
          BOARD_VENDOR_RAMDISK_COMPRESSION := lz4
          BOARD_VENDOR_RAMDISK_COMPRESSION_ARGS := -9
          BOARD_VENDOR_RAMDISK_KERNEL_MODULES_LOAD := device/xiaomi/duchamp/recovery/root/lib/modules/modules.load
          TARGET_RECOVERY_MODULES_LOAD := device/xiaomi/duchamp/recovery/root/lib/modules/modules.load.recovery
          
          TW_EXCLUDE_DEFAULT_USB_INIT := true
          TW_EXTRA_LANGUAGES := false
          TW_NO_LANGUAGE_XML := true
          TW_INCLUDE_NTFS_3G := false
          TW_EXCLUDE_PYTHON := true
          TW_EXCLUDE_APEX := true
          TW_EXCLUDE_TZDATA := true
          TW_EXCLUDE_NANO := true
          TW_EXCLUDE_BASH := true
          TW_EXCLUDE_TWRPAPP := true
          EOF

          # Gỡ bỏ các liên kết HAL cũ trong makefile
          find device/xiaomi/duchamp/ -name "*.mk" -exec sed -i '/android.hardware.boot/d' {} +
          find device/xiaomi/duchamp/ -name "*.mk" -exec sed -i '/bootctrl/d' {} +
          find device/xiaomi/duchamp/ -name "*.mk" -exec sed -i '/mtk_plpath_utils/d' {} +

      - name: Khởi chạy Biên Dịch TWRP
        run: |
          cd ${GITHUB_WORKSPACE}/twrp
          set +e 
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export _JAVA_OPTIONS="-Xmx4g"
          export NINJA_ARGS="-j1 -l1"
          
          lunch twrp_duchamp-eng
          
          echo "🧹 Dọn dẹp rào cản Soong/Vintf gây lỗi build..."
          rm -rf hardware/interfaces/compatibility_matrices
          
          make -j1 vendorbootimage || {
            echo "❌ THÔNG KÊ CÁC FILE LỚN NHẤT TRƯỚC KHI TRÀN:"
            find out/target/product/duchamp/recovery/root/ -type f -exec du -h {} + | sort -rh | head -n 30
            exit 1
          }

      - name: Xuất bản thành phẩm TWRP
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-duchamp-AntiBootloop
          path: |
            twrp/out/target/product/duchamp/vendor_boot.img
