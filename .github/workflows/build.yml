name: Build Recovery

on:
  workflow_dispatch:

env:
  TW_THEME: portrait_hdpi
  TARGET_SCREEN_WIDTH: 1220
  TARGET_SCREEN_HEIGHT: 2712
  TW_SKIP_RES_CHECK: true
  TW_SKIP_THEME_CHECK: true
  ALLOW_MISSING_DEPENDENCIES: true
  FOX_BUILD_DEVICE: duchamp
  LC_ALL: C
  TW_MAX_BRIGHTNESS: "2047"
  TW_DEFAULT_BRIGHTNESS: "1200"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build environment
        run: |
          sudo apt update
          sudo apt -y upgrade
          
          # CÀI ĐẶT CÔNG CỤ STRIP ĐỂ NÉN FILE .KO
          sudo apt install -y binutils-aarch64-linux-gnu
          
          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh

      - name: Sync OrangeFox 12.1
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
          cd ${GITHUB_WORKSPACE}/OrangeFox
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          chmod +x orangefox_sync.sh
          ./orangefox_sync.sh --branch 12.1 --path ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1
          rm -rf ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1/.repo

      - name: Clone Device Tree
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1
          git clone -b test https://github.com/quocanhne123/android_device_xiaomi_duchamp.git device/xiaomi/duchamp

      - name: Build
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1
          
          echo "========================================="
          echo "🗜️ DỌN RÁC & ÉP DUNG LƯỢNG KERNEL MODULES"
          echo "========================================="
          
          # Truy cập vào thư mục chứa danh sách .ko của bạn
          cd device/xiaomi/duchamp/recovery/root/lib/modules/
          
          # 1. Xóa các file MediaTek Dump & Debug (Cực nặng, không dùng trong TWRP)
          rm -f aee_aed.ko aee_hangdet.ko aee_rs.ko mrdump.ko mmprofile.ko log_store.ko
          
          # 2. Xóa các driver Audio, Camera, Wifi vô dụng
          rm -f mtk-afe-external.ko mt6685-audclk.ko mt6685-core.ko
          rm -f clk-mt6897-cam.ko clk-mt6897-vcodec.ko
          rm -f xiaomi_wifi_gpio.ko wl2868c.ko
          rm -f arm_dsu_pmu.ko mtk-swpm-perf-arm-pmu.ko
          
          # 3. VŨ KHÍ TỐI THƯỢNG: Cắt bỏ mã Debug của tất cả các file .ko còn lại
          aarch64-linux-gnu-strip --strip-debug *.ko
          
          # Quay lại thư mục gốc của Android
          cd ../../../../../../
          
          echo "========================================="
          echo "🚀 BƠM LỆNH ÉP GIẢM CÂN TRỰC TIẾP..."
          echo "========================================="
          
          echo "FOX_MINI_BUILD := true" >> device/xiaomi/duchamp/twrp_duchamp.mk
          echo "FOX_EXCLUDE_THEMES := true" >> device/xiaomi/duchamp/twrp_duchamp.mk
          echo "TW_EXCLUDE_TWRPAPP := true" >> device/xiaomi/duchamp/twrp_duchamp.mk
          echo "TW_ONLY_ENGLISH := true" >> device/xiaomi/duchamp/twrp_duchamp.mk
          
          echo "BOARD_RAMDISK_COMPRESSION_ARGS := -9" >> device/xiaomi/duchamp/BoardConfig.mk
          echo "BOARD_VENDOR_RAMDISK_COMPRESSION_ARGS := -9" >> device/xiaomi/duchamp/BoardConfig.mk
          
          rm -rf out/
          
          set +e
          source build/envsetup.sh
          
          export FOX_MINI_BUILD=1
          export ALLOW_MISSING_DEPENDENCIES=true
          set -e
          
          lunch twrp_duchamp-eng
          make -j1 vendorbootimage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Recovery-duchamp
          path: |
            OrangeFox/fox_12.1/out/target/product/duchamp/*.img
            OrangeFox/fox_12.1/out/target/product/duchamp/*.zip
