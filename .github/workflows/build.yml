name: Build OrangeFox

on:
  workflow_dispatch:

env:
  # Cấu hình ép theme để không bị check UI
  TW_THEME: portrait_hdpi
  TARGET_SCREEN_WIDTH: 1220
  TARGET_SCREEN_HEIGHT: 2712
  TW_SKIP_RES_CHECK: true
  TW_SKIP_THEME_CHECK: true
  ALLOW_MISSING_DEPENDENCIES: true
  FOX_BUILD_DEVICE: duchamp
  LC_ALL: C

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build environment
        run: |
          sudo apt update
          sudo apt -y upgrade
          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh

      - name: Sync OrangeFox 12.1
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
          cd ${GITHUB_WORKSPACE}/OrangeFox
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          chmod +x orangefox_sync.sh
          ./orangefox_sync.sh --branch 12.1 --path ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1

      - name: Clone Device Tree
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1
          git clone -b test https://github.com/quocanhne123/android_device_xiaomi_duchamp.git device/xiaomi/duchamp

      - name: Build
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1
          
          # 1. Ép bash KHÔNG ĐƯỢC DỪNG khi gặp lỗi nạp môi trường
          set +e
          source build/envsetup.sh
          
          # 2. Tự động thử các kiểu lunch khác nhau, trúng cái nào thì chạy cái đó
          lunch fox_duchamp-eng || lunch twrp_duchamp-eng || lunch omni_duchamp-eng
          
          # 3. Trả lại chế độ nghiêm ngặt để kiểm soát tiến trình build chính
          set -e
          
          # 4. Ép chạy j1 theo đúng ý bạn để không bị tràn RAM nửa chừng
          make -j1 vendorbootimage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-duchamp
          path: |
            OrangeFox/fox_12.1/out/target/product/duchamp/*.img
            OrangeFox/fox_12.1/out/target/product/duchamp/*.zip