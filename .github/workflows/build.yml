name: Build OrangeFox Recovery

on:
  workflow_dispatch:

env:
  TW_THEME: portrait_hdpi
  TARGET_SCREEN_WIDTH: 1220
  TARGET_SCREEN_HEIGHT: 2712
  TW_SKIP_RES_CHECK: true
  TW_SKIP_THEME_CHECK: true
  ALLOW_MISSING_DEPENDENCIES: true
  FOX_BUILD_DEVICE: duchamp
  LC_ALL: C

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Cài đặt môi trường & Công cụ ép cân
        run: |
          sudo apt update
          sudo apt -y upgrade
          sudo apt install -y binutils-aarch64-linux-gnu
          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh

      - name: Tải Source OrangeFox 12.1
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
          cd ${GITHUB_WORKSPACE}/OrangeFox
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          chmod +x orangefox_sync.sh
          ./orangefox_sync.sh --branch 12.1 --path ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1
          rm -rf ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1/.repo

      - name: Tải Device Tree của bạn
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1
          git clone -b test https://github.com/quocanhne123/android_device_xiaomi_duchamp.git device/xiaomi/duchamp

      - name: Ép dung lượng & Tiêu diệt File Rác
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1
          
          echo "🪓 ÁM SÁT CÁC FILE RÁC KHỔNG LỒ..."
          # Xóa thẳng tay toàn bộ file bảo mật TA rác có dung lượng > 400KB (Tiết kiệm ~6MB)
          find device/xiaomi/duchamp/recovery/root/vendor/mitee/ta/ -type f -size +400k -delete
          
          # Cắt giảm các file thừa khác
          rm -f device/xiaomi/duchamp/recovery/root/system/bin/busybox
          
          echo "🗜️ CẮT MÃ GỠ LỖI MODULES KHẮT KHE HƠN..."
          find device/xiaomi/duchamp -name "*.ko" -exec aarch64-linux-gnu-strip --strip-unneeded {} + 2>/dev/null || true
          
          echo "🗑️ XÓA MODULES RÁC MEDIATEK DUMP..."
          find device/xiaomi/duchamp -name "aee_aed.ko" -delete
          find device/xiaomi/duchamp -name "mrdump.ko" -delete
          find device/xiaomi/duchamp -name "log_store.ko" -delete
          
          echo "🛠️ BƠM CỜ ÉP CÂN VÀO BOARDCONFIG (CHỖ NÀY OFOX MỚI CHỊU ĐỌC)..."
          cat << 'EOF' >> device/xiaomi/duchamp/BoardConfig.mk
          
          # --- CÁC CỜ ÉP CÂN TỐI ĐA CỦA ORANGEFOX ---
          FOX_DRASTIC_SIZE_REDUCTION := true
          FOX_MINI_BUILD := true
          FOX_EXCLUDE_THEMES := true
          TW_EXCLUDE_TWRPAPP := true
          TW_ONLY_ENGLISH := true
          FOX_ENABLE_APP_MANAGER := false
          FOX_EXCLUDE_BASH := true
          FOX_EXCLUDE_NANO_EDITOR := true
          FOX_EXCLUDE_TAR := true
          FOX_EXCLUDE_ARABIC_FONT := true
          FOX_EXCLUDE_AAPT := true
          
          # Nén ramdisk mức cao nhất
          BOARD_RAMDISK_COMPRESSION_ARGS := -9
          BOARD_VENDOR_RAMDISK_COMPRESSION_ARGS := -9
          
          # Hỗ trợ Decryption (Giải mã bộ nhớ FBE)
          TW_INCLUDE_CRYPTO := true
          TW_INCLUDE_CRYPTO_FBE := true
          TW_INCLUDE_FBE_METADATA_DECRYPT := true
          BOARD_USES_METADATA_PARTITION := true
          
          # Chống lag
          TW_MAX_BRIGHTNESS := 2047
          TW_DEFAULT_BRIGHTNESS := 1200
          TW_Y_OFFSET := 80
          TW_HAPTICS_OEM_VIBRATOR := true
          EOF

      - name: Build OrangeFox với -j1 & Bắt Lỗi
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1
          
          set +e 
          
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_MINI_BUILD=1
          lunch twrp_duchamp-eng
          
          echo "🔥 BẮT ĐẦU BUILD: Chờ xem 5.4MB cuối cùng bốc hơi..."
          
          make -j1 vendorbootimage || {
            echo "========================================="
            echo "❌ BUILD VẪN THẤT BẠI! ĐANG TÌM TẬN TAY THỦ PHẠM..."
            echo "========================================="
            
            echo "🗂️ TOP 20 FILE NẶNG NHẤT BỊ NHÉT VÀO RECOVERY:"
            find out/target/product/duchamp/recovery/root/ -type f -exec du -h {} + | sort -rh | head -n 20
            
            echo ""
            echo "🗂️ TOP 20 FILE NẶNG NHẤT TRONG KHO MÃ NGUỒN (DEVICE TREE):"
            find device/xiaomi/duchamp/ -type f -exec du -h {} + | sort -rh | head -n 20
            
            exit 1
          }

      - name: Upload File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-duchamp-Perfect
          path: |
            OrangeFox/fox_12.1/out/target/product/duchamp/*.img
            OrangeFox/fox_12.1/out/target/product/duchamp/*.zip
