- name: Build
  shell: bash
  run: |
    set -ex

    cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1

    export ALLOW_MISSING_DEPENDENCIES=true
    export FOX_BUILD_DEVICE=duchamp

    source build/envsetup.sh

    echo "===== PRODUCTS ====="
    ls device/xiaomi/duchamp

    echo "===== vendorsetup ====="
    cat device/xiaomi/duchamp/vendorsetup.sh

    echo "===== AndroidProducts ====="
    cat device/xiaomi/duchamp/AndroidProducts.mk

    echo "===== Lunch ====="
    lunch twrp_duchamp-eng

    echo "===== Build ====="
    mka vendorbootimage
