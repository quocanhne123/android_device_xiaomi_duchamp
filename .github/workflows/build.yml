name: Build OrangeFox duchamp

on:
  workflow_dispatch:
  push:
    branches: [ test ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Maximize Build Space & Setup Swap
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 16384
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Sync Source Code (Bypass Auth)
      run: |
        mkdir -p OrangeFox/fox_12.1
        cd OrangeFox/fox_12.1
        
        # ĐẶC BIỆT: Tắt mọi trình quản lý thông tin xác thực Git
        git config --global credential.helper ""
        
        # Tạo cấu hình manifest thủ công để bypass 'git clone' trong repo init
        mkdir -p .repo
        # Sử dụng lệnh clone trực tiếp thay vì thông qua repo init để tránh lỗi terminal
        git clone --depth 1 https://github.com/OrangeFoxRecovery/Manifest.git -b master .repo/manifests
        
        # Tạo file điều hướng cho repo sync
        echo '<?xml version="1.0" encoding="UTF-8"?><manifest><include name="default.xml"/></manifest>' > .repo/manifest.xml
        
        # Đồng bộ nguồn
        repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libclang-dev python3 libncurses6 libncurses-dev
        
        cd OrangeFox/fox_12.1
        rm -rf device/xiaomi/duchamp
        git clone -b test https://github.com/quocanhne123/android_device_xiaomi_duchamp.git device/xiaomi/duchamp

    - name: Run Build
      run: |
        cd OrangeFox/fox_12.1
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_DEVICE=duchamp
        export LC_ALL=C
        
        lunch twrp_duchamp-eng || lunch omni_duchamp-eng
        mka recoveryimage -j4

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox_Duchamp_Recovery
        path: |
          OrangeFox/fox_12.1/out/target/product/duchamp/*.img
          OrangeFox/fox_12.1/out/target/product/duchamp/*.zip