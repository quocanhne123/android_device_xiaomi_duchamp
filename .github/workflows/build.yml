name: Build OrangeFox

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          # Bật các tùy chọn này để giải phóng tối đa dung lượng (rất cần cho việc build Android)
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build environment
        run: |
          sudo apt update
          sudo apt -y upgrade

          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts

          sudo bash setup/android_build_env.sh

      - name: Sync OrangeFox 12.1
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
          cd ${GITHUB_WORKSPACE}/OrangeFox

          git clone https://gitlab.com/OrangeFox/sync.git

          cd sync

          chmod +x orangefox_sync.sh

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1

      - name: Clone Device Tree
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1

          git clone \
          -b test \
          https://github.com/quocanhne123/android_device_xiaomi_duchamp.git \
          device/xiaomi/duchamp

      - name: Build
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1

          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=duchamp
          export LC_ALL="C"

          # Tắt chế độ fail-fast của GitHub Actions để tránh bị văng do lỗi vặt trong envsetup
          set +e
          source build/envsetup.sh
          
          # Bật debug mode để xuất log chi tiết nếu có lỗi
          set -x
          
          # Tự động thử lunch twrp, nếu thất bại (do device tree cài đặt là omni) sẽ thử lại với omni
          lunch twrp_duchamp-eng || lunch omni_duchamp-eng
          
          # Bật lại chế độ fail-fast
          set -e

          mka vendorbootimage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-duchamp
          # Chỉ upload các file image và file zip cài đặt để tiết kiệm thời gian và dung lượng
          path: |
            OrangeFox/fox_12.1/out/target/product/duchamp/*.img
            OrangeFox/fox_12.1/out/target/product/duchamp/*.zip